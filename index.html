<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta id="theme-color-meta" name="theme-color" content="#e05d38" />
  <meta
    name="description"
    content="CampusMart is the student marketplace for SSIPMT — buy and sell with verified students and hire the skills your classmates already have."
  />
  <title>CampusMart — the SSIPMT student marketplace</title>

  <!-- Applied before first paint so night mode never flashes white. -->
  <script>
    (function () {
      try {
        if (localStorage.getItem("campusmart-theme") === "dark") {
          document.documentElement.classList.add("dark");
        }
      } catch (error) {
        /* private mode or storage disabled — light is a fine default */
      }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Headings: Space Grotesk. Body: Geist. UI, labels, buttons: Manrope. -->
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap"
    rel="stylesheet"
  />
  <link
    href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap"
    rel="stylesheet"
  />
</head>


<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
